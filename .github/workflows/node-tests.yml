name: Node tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --prefix sim
      - run: node --test --test-concurrency=1 test/prototype/sim.test.mjs test/v3/sim.test.mjs test/v3-top/v13/timing.test.mjs test/mvp/rules.test.mjs test/mvp/long-tail.test.mjs test/mvp/analyze.test.mjs test/mvp/walls.test.mjs test/item-rating/rating.test.mjs test/item-rating/rate-items.test.mjs test/item-rating/missing.test.mjs test/item-rating/runtime.test.mjs test/result-advice/tips.test.mjs test/result-advice/decisive.test.mjs test/mvp/stills.test.mjs
      - run: npm ci --prefix web
      - run: npm run build --prefix web
  import-tool:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --prefix tools/import-item
      - run: npm test --prefix tools/import-item
        env:
          SHOOT_RESTART_REPETITIONS: 40
