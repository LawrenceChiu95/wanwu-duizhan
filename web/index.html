<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070a12">
<link rel="icon" href="data:,">
<title>万物对战 · 战斗陀螺</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="fx" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>

  <header id="hud" hidden>
    <div class="side s0">
      <div class="who"><i class="dot"></i><b>你</b></div>
      <div class="core"><i class="ball"></i><div class="bar"><i class="chip"></i><i class="fill"></i></div></div>
      <div class="parts"></div>
    </div>
    <div class="mid"><span class="clock" id="clock">0</span><span class="slowtag" id="slowtag">慢放</span></div>
    <div class="side s1">
      <div class="who"><b>对手</b><i class="dot"></i></div>
      <div class="core"><div class="bar"><i class="chip"></i><i class="fill"></i></div><i class="ball"></i></div>
      <div class="parts"></div>
    </div>
  </header>

  <header id="foe">
    <span class="label">对手</span><span id="foeParts"></span>
  </header>

  <div id="banner" aria-live="polite"></div>
  <div id="caption" aria-live="polite"><p id="captionText"></p></div>

  <section id="build">
    <div class="slots">
      <div class="slot" data-slot="0">
        <button type="button" class="item" data-pick="0"><b></b><i class="lux">Lux3D</i><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" /></svg></button>
        <div class="seg orient" role="radiogroup">
          <button type="button" data-orient="out" role="radio"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="3.2" /><path d="M9.5 12H21" /><path d="M17 8.5l4 3.5-4 3.5" /></svg>伸出</button>
          <button type="button" data-orient="hug" role="radio"><svg viewBox="0 0 24 24"><circle cx="10" cy="12" r="4" /><path d="M16.5 5.5a9 9 0 0 1 0 13" /></svg>贴着</button>
        </div>
      </div>
      <div class="slot" data-slot="1">
        <button type="button" class="item" data-pick="1"><b></b><i class="lux">Lux3D</i><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" /></svg></button>
        <div class="seg orient" role="radiogroup">
          <button type="button" data-orient="out" role="radio"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="3.2" /><path d="M9.5 12H21" /><path d="M17 8.5l4 3.5-4 3.5" /></svg>伸出</button>
          <button type="button" data-orient="hug" role="radio"><svg viewBox="0 0 24 24"><circle cx="10" cy="12" r="4" /><path d="M16.5 5.5a9 9 0 0 1 0 13" /></svg>贴着</button>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="seg spread" role="radiogroup" aria-label="两件的位置">
        <button type="button" data-spread="e180" role="radio"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" /><path d="M2 12h6.5M15.5 12H22" /></svg>对面</button>
        <button type="button" data-spread="e90" role="radio"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" /><path d="M2 12h6.5M12 15.5V22" /></svg>挨着</button>
      </div>
      <button type="button" class="go" id="goBtn"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" /></svg><span>开打</span></button>
    </div>
  </section>

  <section id="result" hidden>
    <div class="winner" id="winnerLine"></div>
    <p class="why" id="whyLine"></p>
    <div class="actions">
      <button type="button" id="replayBtn" class="ghost" aria-label="重看慢镜头"><svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.6 4.7" /><path d="M5 4v5h5" /></svg>重看</button>
      <button type="button" id="againBtn" class="primary"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L9 20H4v-5z" /></svg>换个装法再打</button>
    </div>
  </section>

  <button id="creditsBtn" class="link" type="button">素材署名</button>

  <div id="sheet" hidden>
    <div class="panel">
      <div class="head"><b id="sheetTitle">换一件</b><button type="button" class="close" id="sheetClose" aria-label="关闭">×</button></div>
      <div class="grid" id="sheetGrid"></div>
    </div>
  </div>

  <div id="credits" hidden>
    <div class="panel">
      <div class="head"><b>素材署名</b><button type="button" class="close" id="creditsClose" aria-label="关闭">×</button></div>
      <div id="creditsBody"></div>
    </div>
  </div>

  <div id="busy" hidden><i></i><span id="busyText">载入中</span></div>
  <div id="error" hidden></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
