<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101915">
<title>万物对战</title>
<link rel="icon" href="data:,">
<!-- 发布版首页: 凡朔's cover (UI preview 11-07, wanwu-ui-preview-20261107-r1), self-contained for pack-artifact.mjs; its
     frame and button faces are the old-terminal textures as small WebP (media/). -->
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; --cream: #eee6cc; --amber: #edbb59; --teal: #7ee4ca; }
body { margin: 0; background: #0c110f; color: var(--cream); font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
main { width: min(100%, 560px); min-height: 100svh; margin: auto; display: flex; flex-direction: column; overflow: hidden; background: #111b17; box-shadow: 0 0 80px #0009; }
h1, p { margin: 0; }
header { display: flex; align-items: center; gap: 9px; padding: 14px 22px; background: linear-gradient(110deg, #29342b, #14241e); box-shadow: inset 0 -1px #948b64, inset 0 -4px #0d1713;
  font-size: 13px; font-weight: 800; letter-spacing: 0.1em; position: relative; z-index: 2; }
header small { margin-left: auto; color: var(--teal); font: 700 12px/1.5 Consolas, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0.08em; }
header i { width: 6px; height: 6px; background: var(--teal); box-shadow: 0 0 8px #78ffe5; }
.battle { flex: 1; isolation: isolate; position: relative; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(ellipse at 52% 63%, #574556, #25222e 43%, #10191b 82%); }
.dome { position: absolute; inset: -28%; z-index: -1; transform: rotate(-29deg);
  background: repeating-radial-gradient(ellipse at 50% -65%, transparent 0 73px, #89d4cd53 74px, transparent 76px), repeating-radial-gradient(ellipse at -65% 55%, transparent 0 88px, #a591ba45 89px, transparent 91px); }
.dome::after { content: ""; position: absolute; inset: 20% -10%; border-bottom: 4px solid #e665ad; border-radius: 50%; filter: drop-shadow(0 0 7px #f255a6); mask-image: linear-gradient(90deg, transparent 17%, black 80%, transparent); }
.title { position: relative; z-index: 1; padding: 24px 22px 0; pointer-events: none; }
h1 { font-size: clamp(49px, 14vw, 82px); font-weight: 900; line-height: 1.1; letter-spacing: -0.055em; text-shadow: 0 3px #101612; }
h1 span { color: var(--amber); }
.title p { font-size: 15px; letter-spacing: 0.14em; margin-top: 8px; }
.fighters { width: 100%; height: clamp(265px, 49svh, 520px); object-fit: contain; margin: auto; filter: drop-shadow(0 12px 10px #100c15aa); }
footer { position: relative; background: repeating-linear-gradient(0deg, #12231c 0 2px, #15271f 3px); border: 12px solid transparent; border-image: url("media/frame.webp") 70 stretch; padding: 6px 8px 9px; }
footer p { font-size: 14px; line-height: 1.6; margin: 5px 0 12px; color: #d9ddca; }
.start { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 11px solid transparent; border-image: url("media/yellow.webp") 73 fill stretch; padding: 1px 10px;
  color: #222519; font-size: 21px; font-weight: 900; text-decoration: none; }
.start:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
@media (min-width: 620px) { main { border-inline: 1px solid #565747; } }
</style>
</head>
<body>
<main>
  <header><i></i> 地下竞技场 <small>OBJECT CLASH</small></header>
  <section class="battle">
    <div class="dome" aria-hidden="true"></div>
    <div class="title"><h1>万物<span>对战</span></h1><p>两件旧物，一颗核心。</p></div>
    <img class="fighters" src="media/reactors.webp" alt="两组改装道具从球形竞技场两侧相向逼近">
  </section>
  <footer><p>把家里的旧物拼起来，撞开对手的核心。</p><a class="start" href="play/index.html">进入组装台 <b aria-hidden="true">→</b></a></footer>
</main>
</body>
</html>
