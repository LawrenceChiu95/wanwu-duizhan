<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>万物对战 · 战斗陀螺</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: "Smiley"; src: url("{{FONT}}") format("woff"); font-display: swap; }
:root { --c0: #ff8a3d; --c0d: #ff5e14; --c0l: #ffc08f; --c1: #3db4ff; --ink: #f3f6ff; --mute: #8f9bb6; --bg: #070912;
  --display: "Smiley", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }
body { min-height: 100vh; background: radial-gradient(700px 520px at 50% 18%, rgba(40, 70, 140, 0.28), transparent 70%), repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.018) 0 2px, transparent 2px 22px), var(--bg); }
.wrap { max-width: 440px; margin: 0 auto; padding: 16px 16px 26px; display: flex; flex-direction: column; gap: 16px; }
.hero { position: relative; aspect-ratio: 780 / 700; background: url("hero.jpg") center 30% / cover; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, var(--bg)); }
.title { margin-top: -64px; position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(50px, 17vw, 76px); line-height: 0.92; letter-spacing: 0.02em; }
h1 .a { color: var(--c0); text-shadow: 0 0 30px rgba(255, 138, 61, 0.4); }
h1 .b { color: var(--c1); text-shadow: 0 0 30px rgba(61, 180, 255, 0.4); }
.sub { font-family: var(--display); font-size: 18px; letter-spacing: 0.35em; writing-mode: vertical-rl; color: var(--ink); opacity: 0.85; padding-bottom: 4px; }
.pitch { margin: 0; font-size: 15px; line-height: 1.7; color: #d3dbee; }
.play { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; text-decoration: none;
  font-family: var(--display); font-size: 28px; letter-spacing: 0.1em; color: #1a0900; background: linear-gradient(100deg, #ffd0a0, var(--c0) 45%, var(--c0d));
  clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }
.play::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent); animation: shine 2.6s ease-in-out infinite; }
.play svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
@keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { flex: 1 1 120px; padding: 10px 12px; background: rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 0 1px rgba(160, 190, 255, 0.14); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
.fact b { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--ink); }
.fact span { display: block; margin-top: 3px; font-size: 12px; line-height: 1.5; color: var(--mute); }
.fact.lux b::after { content: "Lux3D"; margin-left: 6px; vertical-align: 3px; font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif; font-size: 9px; font-weight: 800; color: #0a0f1c; background: #b8f06a; padding: 1px 5px; }
.note { margin: 0; font-size: 12px; line-height: 1.6; color: var(--mute); }
@media (prefers-reduced-motion: reduce) { .play::after { animation: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="hero" role="img" aria-label="两颗陀螺正在互撞"></div>
  <div class="title"><h1><span class="a">万物</span><br><span class="b">对战</span></h1><span class="sub">战斗陀螺</span></div>
  <p class="pitch">挑两件东西装到一颗核心上，让它转起来去撞对面。谁的核心先碎谁输，一局三十秒上下。</p>
  <a class="play" href="play/index.html"><span>开始玩</span><svg viewBox="0 0 24 24"><path d="M5 12h13" /><path d="M13 6l6 6-6 6" /></svg></a>
  <div class="facts">
    <div class="fact"><b>伸出</b><span>长的一头朝外，转起来抡人</span></div>
    <div class="fact"><b>贴着</b><span>竖着贴在核心上，替它挡</span></div>
    <div class="fact lux"><b>锅 · 台灯</b><span>用照片生成的 3D 模型</span></div>
    <div class="fact"><b>核心先碎的输</b><span>碎一件，那边没了攻和挡</span></div>
  </div>
  <p class="note">竖着拿手机玩最好。素材署名在游戏右下角。</p>
</main>
</body>
</html>
